[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Classes de domaine préfixées "Test" (TestDesignOutput, TestSummary, TestDesignAgent...)
# ne sont pas des classes de test — évite le faux-positif de collection pytest.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
