# Un seul domaine pour le frontend et l'API : le cookie de session
# (samesite=lax) fonctionne sans configuration CORS.
server {
    listen 80;
    server_tokens off;

    # Pièces jointes : 15 Mo max côté backend (MAX_ATTACHMENT_SIZE_MB) + marge multipart.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;

    # Flux SSE du suivi des tickets : pas de mise en tampon, connexion longue.
    location = /api/tracking/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le chat de clarification appelle le LLM de façon synchrone.
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Fichiers générés par Vite (noms avec hash) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        try_files $uri /index.html;
    }
}
